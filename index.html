<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Златоустовский индустриальный колледж</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/navigator/">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <img src="page/logo.png" alt="Логотип" class="logo">
    <span class="nad3">Златоустовский индустриальный колледж им. П.П. Аносова</span>

    <img src="page/muze.png" alt="Надпись" class="center-img">

    <!-- Кнопка для открытия каталога -->
    <button class="button-catalog" id="openCatalog" aria-expanded="false">Открыть каталог</button>
    
    <!-- Элементы главной страницы для аудита -->
    <div class="main-page-elements" style="display:none;">
        <span data-element="logo" data-action="view">Логотип</span>
        <span data-element="title" data-action="view">Заголовок</span>
        <span data-element="center_image" data-action="view">Центральное изображение</span>
        <span data-element="catalog_button" data-action="click">Кнопка каталога</span>
    </div>

    <!-- Левое полноэкранное окошко -->
    <div class="sidebar-left" id="sidebarLeft" hidden>
        <!-- Шапка с навигацией -->
        <div class="catalog-header">
            <button class="back-btn" id="backBtn" hidden>
                <span class="back-arrow">←</span>
                <span class="back-text">Назад</span>
            </button>
            <h2 class="catalog-title" id="catalogTitle">Каталог специальностей</h2>
            <button class="close-btn" id="closeSidebar" aria-label="Закрыть каталог">×</button>
        </div>
        <!-- Поиск -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск...">
            <button class="search-clear-btn" id="searchClearBtn" hidden>×</button>
        </div>
        <!-- Сетка элементов текущего уровня -->
        <div class="items-grid-full" id="catalogGrid"></div>
    </div>

    <!-- Оверлей для затемнения фона -->
    <div class="overlay" hidden></div>

    <script src="js/script.js"></script>

</body>
</html>
