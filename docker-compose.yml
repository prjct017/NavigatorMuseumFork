services:
  web:
    image: python:3.11-slim
    container_name: navigator-museum
    working_dir: /app

    command: >
      sh -c "
      apt-get update &&
      apt-get install -y --no-install-recommends git &&
      rm -rf /var/lib/apt/lists/* &&
      find /app -mindepth 1 -maxdepth 1 -exec rm -rf {} + &&
      git clone --depth 1 --branch \"$${GIT_BRANCH:-main}\" \"$${GIT_REPO_URL:-https://github.com/kop1ka/NavigatorMuseum.git}\" /tmp/repo &&
      cp -a /tmp/repo/. /app/ &&
      rm -rf /tmp/repo &&
      pip install --no-cache-dir -r requirements.txt &&
      gunicorn --bind 0.0.0.0:5000 --workers \"$${GUNICORN_WORKERS:-2}\" --threads \"$${GUNICORN_THREADS:-2}\" app:app
      "

    ports:
      - "${PORT:-5000}:5000"
      
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set}
      GIT_REPO_URL: ${GIT_REPO_URL:-https://github.com/kop1ka/NavigatorMuseum.git}
      GIT_BRANCH: ${GIT_BRANCH:-main}

    env_file:
      - .env

    restart: unless-stopped
